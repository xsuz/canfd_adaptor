[package]
name = "canfd_adaptor"
version = "0.1.0"
edition = "2024"

publish = false

[dependencies]
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0",  features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-stm32 = { version = "0.6.0",  features = ["defmt", "unstable-pac", "time-driver-any", "stm32h503rb", "memory-x"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

heapless = "0.9"
static_cell = "2.1"

embedded-hal = { version = "1.0" }

[dependencies.mavlink] # MAVLink library (wait for 0.9.0 version)
git = "https://github.com/TeamMeltingPoppo/mavlink-rs"
tag = "0.1.0"
features = ["dialect-swingby", "embedded"]
default-features = false


[profile.release]
# Enable generation of debug symbols even on release builds
debug = true

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/stm32h503" }
]
